<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Blob 1: Brown Rice/Mud Blob (Cute and pathetic) -->
  <path d="M50,40 C70,30 90,50 80,70 C60,90 30,70 50,40 Z" fill="#8B5A2B" />
  <!-- Eyes: > < -->
  <path d="M55,50 L60,55 L55,60" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M75,50 L70,55 L75,60" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mouth: Squiggly -->
  <path d="M60,65 Q65,62 70,65" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Blob 2: Red Ketchup Blob (Cute and pathetic) -->
  <path d="M120,130 C135,110 160,130 150,150 C135,170 100,150 120,130 Z" fill="#B22222" />
  <!-- Eyes: X X -->
  <path d="M125,135 L130,140 M130,135 L125,140" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M140,135 L145,140 M145,135 L140,140" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth -->
  <circle cx="135" cy="145" r="2" fill="#FFF"/>

  <!-- A few small soap bubbles mixed in -->
  <circle cx="30" cy="80" r="10" fill="#FFF" stroke="#4A3B32" stroke-width="2"/>
  <circle cx="20" cy="70" r="6" fill="#FFF" stroke="#4A3B32" stroke-width="2"/>
  <path d="M25,78 Q28,75 32,78" fill="none" stroke="#D4F1F9" stroke-width="2" stroke-linecap="round"/>
  
  <circle cx="160" cy="80" r="12" fill="#FFF" stroke="#4A3B32" stroke-width="2"/>
  <circle cx="170" cy="95" r="5" fill="#FFF" stroke="#4A3B32" stroke-width="2"/>
  <path d="M156,76 Q160,73 164,76" fill="none" stroke="#D4F1F9" stroke-width="2" stroke-linecap="round"/>
</svg>
